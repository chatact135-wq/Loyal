{% extends 'loyalty/base.html' %}
{% block content %}
<h2 class="text-xl font-bold text-center mb-2 text-amber-400">Staff Portal</h2>
<p class="text-slate-400 text-center mb-6 text-sm">Add purchase for customer: <span class="text-white">{{ customer.phone_number }}</span></p>
<form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Total Bill Amount (AED)</label>
        <input type="number" step="0.01" name="amount_spent" placeholder="e.g. 150.00" required class="w-full px-4 py-3 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-amber-400">
    </div>
    <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition">Add Points (10 AED = 1 Pt)</button>
</form>
{% endblock %}
