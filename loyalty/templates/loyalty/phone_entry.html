{% extends 'loyalty/base.html' %}
{% block content %}
<h2 class="text-2xl font-bold text-center mb-2 text-amber-400">Welcome</h2>
<p class="text-slate-400 text-center mb-6 text-sm">Enter your phone number to sign up or log in</p>
<form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Phone Number</label>
        <input type="text" name="phone_number" placeholder="+971 50 123 4567" required class="w-full px-4 py-3 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-amber-400">
    </div>
    <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition">Send Verification Code</button>
</form>
{% endblock %}
