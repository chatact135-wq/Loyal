{% extends 'loyalty/base.html' %}
{% block content %}
<h2 class="text-2xl font-bold text-center mb-2 text-amber-400">Set Password</h2>
<p class="text-slate-400 text-center mb-6 text-sm">Create a password for quick login next time</p>
<form method="POST" class="space-y-4">
    {% csrf_token %}
    <input type="password" name="password" placeholder="New Password" required class="w-full px-4 py-3 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-amber-400">
    <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition">Save Password & Continue</button>
</form>
{% endblock %}
